<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFDF6"/>
            <stop offset="1" stop-color="#FFF6E5"/>
        </linearGradient>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="600" height="480" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="500" cy="95" r="62" fill="#F4BF00" opacity="0.12"/>
    <circle cx="500" cy="95" r="42" fill="#F4BF00"/>

    <!-- birds -->
    <path d="M90 70 q10 -12 20 0 q10 -12 20 0" stroke="#273c66" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M150 105 q8 -10 16 0 q8 -10 16 0" stroke="#273c66" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- distant mountains -->
    <path d="M0 230 L95 145 L175 205 L255 120 L355 215 L455 150 L600 225 L600 480 L0 480 Z" fill="#3d5479" opacity="0.45"/>
    <!-- near mountains -->
    <path d="M0 265 L120 185 L220 245 L340 175 L460 255 L600 195 L600 480 L0 480 Z" fill="#273c66" opacity="0.85"/>

    <!-- rolling hills -->
    <path d="M0 345 C100 305 200 365 320 335 C420 315 520 355 600 325 L600 480 L0 480 Z" fill="#5c9418"/>
    <path d="M0 375 C110 340 210 390 330 365 C430 345 530 380 600 360 L600 480 L0 480 Z" fill="#76BB20"/>

    <!-- path -->
    <path d="M250 480 C260 420 300 400 330 355 C345 335 355 315 350 300" stroke="#E9DCC0" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- rural school -->
    <g>
        <line x1="205" y1="238" x2="205" y2="205" stroke="#273c66" stroke-width="3"/>
        <path d="M205 205 L233 213 L205 224 Z" fill="#76BB20"/>
        <polygon points="138,290 205,236 272,290" fill="#8a5a34"/>
        <rect x="150" y="288" width="110" height="76" rx="4" fill="#FFF6E5" stroke="#E9DCC0" stroke-width="2"/>
        <rect x="160" y="300" width="26" height="26" rx="4" fill="#9FD8FF" stroke="#273c66" stroke-width="2"/>
        <rect x="224" y="300" width="26" height="26" rx="4" fill="#9FD8FF" stroke="#273c66" stroke-width="2"/>
        <rect x="191" y="326" width="28" height="38" rx="3" fill="#273c66"/>
        <circle cx="212" cy="345" r="2.2" fill="#F4BF00"/>
    </g>

    <!-- small sprout near path -->
    <g transform="translate(430,338) scale(0.55)">
        <path d="M30 90 C30 74 30 64 30 52" stroke="#4C8014" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M30 68 C10 63 -1 44 7 26 C25 33 32 52 30 68 Z" fill="#5C9418"/>
        <path d="M30 58 C51 53 62 33 54 15 C36 22 28 42 30 58 Z" fill="#8ED13A"/>
    </g>

    <!-- child agent of change, backpack + raised arm -->
    <g>
        <ellipse cx="368" cy="382" rx="34" ry="7" fill="#000000" opacity="0.08"/>
        <!-- backpack -->
        <rect x="380" y="292" width="26" height="40" rx="8" fill="#273c66"/>
        <circle cx="393" cy="305" r="3" fill="#F4BF00"/>
        <!-- legs -->
        <rect x="352" y="345" width="12" height="34" rx="5" fill="#8a5a34"/>
        <rect x="372" y="345" width="12" height="34" rx="5" fill="#8a5a34"/>
        <!-- torso -->
        <path d="M348 296 C348 286 390 286 390 296 L386 350 L352 350 Z" fill="#76BB20"/>
        <!-- raised arm -->
        <path d="M384 300 C400 292 410 278 412 264" stroke="#F2C9A0" stroke-width="9" stroke-linecap="round" fill="none"/>
        <circle cx="413" cy="260" r="6" fill="#F2C9A0"/>
        <!-- other arm -->
        <path d="M352 304 C344 314 340 326 342 336" stroke="#F2C9A0" stroke-width="9" stroke-linecap="round" fill="none"/>
        <!-- head -->
        <circle cx="368" cy="276" r="19" fill="#F2C9A0"/>
        <path d="M349 272 C349 254 387 254 387 272 C378 264 358 264 349 272 Z" fill="#3a2317"/>
    </g>

    <!-- pennant flag: brigada estudiantil -->
    <g transform="translate(150,335)">
        <line x1="0" y1="45" x2="0" y2="0" stroke="#8a5a34" stroke-width="3"/>
        <path d="M0 3 L34 12 L0 21 Z" fill="#E0503A"/>
    </g>
</svg>
